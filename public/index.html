<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTS Stats Analyzer</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <header class="header">
        <h1>OTS Stats Analyzer</h1>
        <p class="subtitle">Przegląd statystyk CPU i graczy online</p>
    </header>

    <main class="container">
        <section class="controls">
            <nav class="tabs" id="source-tabs" aria-label="Źródło danych"></nav>

            <div class="controls-row">
                <div class="range-buttons" role="group" aria-label="Zakres czasu">
                    <button type="button" data-range="hour">1h</button>
                    <button type="button" data-range="day" class="active">24h</button>
                    <button type="button" data-range="7d">7d</button>
                </div>

                <div class="time-nav">
                    <button type="button" id="time-prev" title="Wcześniej">◀</button>
                    <label>
                        Koniec zakresu
                        <input type="datetime-local" id="end-time" step="1">
                    </label>
                    <button type="button" id="time-next" title="Później">▶</button>
                </div>

                <div class="sort-controls">
                    <label>
                        Sortowanie funkcji
                        <select id="sort-select">
                            <option value="max">Max CPU %</option>
                            <option value="avg">Avg CPU %</option>
                            <option value="total">Total time (ms)</option>
                        </select>
                    </label>
                </div>
            </div>
        </section>

        <div class="loading hidden" id="loading">Ładowanie danych…</div>
        <div class="error hidden" id="error"></div>

        <section class="dashboard">
            <div class="chart-panel">
                <h2 id="overview-title">CPU i gracze online</h2>
                <div class="chart-wrap">
                    <canvas id="overview-chart"></canvas>
                </div>
            </div>

            <aside class="functions-panel">
                <h2>Top funkcje</h2>
                <ol class="function-list" id="function-list"></ol>
            </aside>
        </section>

        <section class="function-chart-section hidden" id="function-section">
            <h2 id="function-title">Wykres funkcji</h2>
            <div class="chart-wrap">
                <canvas id="function-chart"></canvas>
            </div>
        </section>
    </main>
</body>
</html>
