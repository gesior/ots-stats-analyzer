<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTS Stats Analyzer — Lags</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="js/chart.umd.min.js" defer></script>
    <script src="js/slow.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="header-row">
            <div>
                <h1>OTS Stats Analyzer</h1>
                <p class="subtitle">Slow execution events and lag trends</p>
            </div>
            <nav class="page-nav" aria-label="Page navigation">
                <a href="index.html">CPU</a>
                <a href="slow.html" class="active">Lags</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="controls">
            <nav class="tabs" id="source-tabs" aria-label="Data source"></nav>

            <div class="controls-row">
                <div class="range-buttons" role="group" aria-label="Time range">
                    <button type="button" data-range="hour">1h</button>
                    <button type="button" data-range="day" class="active">24h</button>
                    <button type="button" data-range="7d">7d</button>
                    <button type="button" data-range="14d">14d</button>
                    <button type="button" data-range="30d">30d</button>
                </div>

                <div class="time-nav">
                    <button type="button" id="time-prev" title="Earlier">◀</button>
                    <label>
                        End of range
                        <input type="datetime-local" id="end-time" step="1">
                    </label>
                    <button type="button" id="time-next" title="Later">▶</button>
                </div>

                <div class="sort-controls">
                    <label>
                        Function sorting
                        <select id="sort-select">
                            <option value="count" selected>Event count</option>
                            <option value="max">Max time (ms)</option>
                            <option value="avg">Avg time (ms)</option>
                            <option value="total">Total time (ms)</option>
                        </select>
                    </label>
                </div>
            </div>
        </section>

        <div class="loading hidden" id="loading">Loading data...</div>
        <div class="error hidden" id="error"></div>

        <section class="dashboard">
            <div class="charts-main">
                <div class="chart-panel">
                    <h2 id="overview-title">Lag activity over time</h2>
                    <div class="chart-wrap">
                        <canvas id="overview-chart"></canvas>
                    </div>
                </div>

                <section class="function-chart-section hidden" id="function-section">
                    <h2 id="function-title">Function chart</h2>
                    <div class="chart-wrap">
                        <canvas id="function-chart"></canvas>
                    </div>
                </section>
            </div>

            <aside class="functions-panel">
                <h2>Top lagging functions</h2>
                <ol class="function-list" id="function-list"></ol>
            </aside>
        </section>
    </main>
</body>
</html>
